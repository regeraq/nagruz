<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Voltkeeper">
  <defs>
    <linearGradient id="vk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <clipPath id="vk-disc">
      <circle cx="128" cy="128" r="128"/>
    </clipPath>
  </defs>

  <!-- Круг, а не скруглённый квадрат: поисковики обрезают фавикон по кругу -->
  <circle cx="128" cy="128" r="128" fill="url(#vk-bg)"/>
  <circle cx="128" cy="79" r="100" fill="#ffffff" opacity="0.07" clip-path="url(#vk-disc)"/>

  <!-- Молния -->
  <path d="M136.3 44.8 L53.1 144.6 L128 144.6 L119.7 211.2 L202.9 111.4 L128 111.4 Z" fill="#ffffff"/>
</svg>
