<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="Профессиональные нагрузочные устройства НУ-100, НУ-200, НУ-30 для тестирования дизель-генераторов, газопоршневых и газотурбинных установок, ИБП и аккумуляторных батарей. Точная имитация нагрузки." />
    <meta name="keywords" content="нагрузочное устройство, тестирование генераторов, испытательное оборудование, НУ-100, НУ-200, НУ-30, дизель-генератор, ИБП, аккумуляторные батареи" />
    <meta property="og:title" content="Нагрузочные устройства" />
    <meta property="og:description" content="Профессиональные нагрузочные устройства для тестирования генераторов и ИБП" />
    <meta name="theme-color" content="#1d4ed8" />
    <!--
      Поисковики берут растровый фавикон кратный 48px и обрезают его по кругу,
      поэтому кроме SVG отдаём готовые PNG нужных размеров.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Нагрузочные устройства</title>
    <style>
      html {
        background: linear-gradient(135deg, hsl(210, 40%, 98%) 0%, hsl(220, 30%, 97%) 25%, hsl(210, 35%, 98%) 50%, hsl(200, 40%, 97%) 75%, hsl(210, 40%, 98%) 100%) !important;
        background-attachment: fixed !important;
      }
      html.dark {
        background: hsl(220, 25%, 8%) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
