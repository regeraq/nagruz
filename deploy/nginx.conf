# ============================================================
#  nginx для loaddevice
# ============================================================
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/loaddevice
#   sudo ln -s /etc/nginx/sites-available/loaddevice /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   # Замените ВСЕ вхождения example.ru на свой домен:
#   sudo sed -i 's/example\.ru/ваш-домен.ru/g' /etc/nginx/sites-available/loaddevice
#   sudo nginx -t && sudo systemctl reload nginx
#
# ВАЖНО: блок с ssl_certificate ниже закомментирован. Сначала поднимите
# сайт по HTTP, получите сертификат через certbot (он сам впишет пути),
# и только потом включайте редирект на HTTPS.
# ============================================================

# Ограничение частоты запросов на уровне nginx — первый эшелон защиты
# от перебора и флуда, ещё до того как запрос дойдёт до Node.js.
limit_req_zone $binary_remote_addr zone=loaddevice_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=loaddevice_auth:10m rate=2r/s;

upstream loaddevice_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ---------- HTTP: ACME + редирект на HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;

    # Certbot webroot должен оставаться доступным по HTTP,
    # иначе продление сертификата будет падать.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Пока сертификата нет — закомментируйте redirect и раскомментируйте
    # блок proxy ниже, чтобы сайт работал по HTTP.
    location / {
        return 301 https://$host$request_uri;
    }

    # location / {
    #     proxy_pass http://loaddevice_app;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.ru www.example.ru;

    # HTTP/2 включается по-разному в зависимости от версии nginx.
    # Проверьте версию: nginx -v
    #
    #   nginx 1.25.1 и новее  → раскомментируйте строку ниже:
    # http2 on;
    #
    #   nginx 1.24 и старее (Ubuntu 24.04 по умолчанию) → вместо этого
    #   допишите http2 в директивы listen выше:
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #
    # Директива `http2 on;` в nginx 1.24 вызывает ошибку "unknown directive",
    # и nginx не запустится — поэтому по умолчанию она закомментирована.

    # --- Сертификаты (пути впишет certbot) ---
    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Только современные протоколы. TLS 1.0/1.1 небезопасны.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS. Включайте ТОЛЬКО когда убедились, что HTTPS работает стабильно:
    # браузер запомнит это правило и откажется открывать сайт по HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Остальные security-заголовки (CSP, X-Frame-Options и т.д.) выставляет
    # само приложение — здесь их дублировать не нужно, иначе будут конфликты.

    # Не раскрываем версию nginx.
    server_tokens off;

    # Должно быть не меньше лимита тела в приложении (15 MB на загрузки).
    client_max_body_size 16m;
    client_body_timeout 60s;

    # --- Логи ---
    access_log /var/log/nginx/loaddevice-access.log;
    error_log  /var/log/nginx/loaddevice-error.log warn;

    # --- Сжатие ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # --- Статика собранного фронтенда ---
    # Файлы с хэшем в имени можно кэшировать «навсегда».
    location /assets/ {
        proxy_pass http://loaddevice_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Health check: не засоряем access-логи ---
    location = /api/health {
        proxy_pass http://loaddevice_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Строгий лимит на аутентификацию ---
    location ~ ^/api/auth/(login|register|change-password|resend-verification) {
        limit_req zone=loaddevice_auth burst=5 nodelay;
        proxy_pass http://loaddevice_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API ---
    location /api/ {
        limit_req zone=loaddevice_api burst=40 nodelay;
        proxy_pass http://loaddevice_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # --- Всё остальное: SPA ---
    location / {
        proxy_pass http://loaddevice_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
